<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Stocks CLP - RI</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--ink:#1a1a1a;--mut:#666;--line:#d0d0d0;--btn:#2b2b2b;--btnink:#fff;--soft:#e6e6e6;--bad:#8a1c1c}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#eee;--mut:#999;--line:#3a3a3a;--btn:#e8e8e8;--btnink:#111;--soft:#2c2c2c;--bad:#e08a8a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
[hidden]{display:none!important}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
#top .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
#top .t{font-weight:700}
#top small{color:var(--mut)}
.bar{height:6px;background:var(--soft);border-radius:3px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--btn);width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters select,.filters input{flex:1 1 120px;min-width:0;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:19px;margin:0 0 6px;line-height:1.25}
.meta{color:var(--mut);font-size:14px;margin:2px 0}
.meta b{color:var(--ink);font-weight:600}
.qte{display:inline-block;margin-top:8px;padding:6px 10px;background:var(--soft);border-radius:8px;font-weight:600}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],select.f,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-family:inherit}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btnink);font-size:17px;font-weight:600;padding:14px;border-radius:10px;width:100%;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .th{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:24px;padding:0}
#foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
#foot .btn{padding:13px}
#foot .btn.main{flex:2}
#foot .btn:not(.main){flex:1}
.msg{padding:10px 12px;border-radius:8px;background:var(--soft);margin:0 0 10px;font-size:14px}
.msg.bad{border:1px solid var(--bad);color:var(--bad);background:transparent}
.center{text-align:center;padding:48px 20px}
.tag{font-size:12px;color:var(--mut)}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;padding:4px}
</style>
</head>
<body>
<div id="top" hidden>
  <div class="r1"><span class="t">Stocks CLP - RI</span><span><small id="who"></small> <button class="link" id="reload">Actualiser</button> <button class="link" id="out">Quitter</button></span></div>
  <div class="bar"><i id="prog"></i></div>
  <small id="stat"></small>
  <div class="filters" style="margin-top:6px">
    <select id="fRay"></select>
    <select id="fCat"></select>
    <select id="fMode"><option value="todo">À traiter</option><option value="done">Traitées</option><option value="all">Toutes</option></select>
    <input id="fQ" type="search" placeholder="Rechercher (désignation, réf.)">
  </div>
</div>
<main id="main"></main>
<div id="foot" hidden>
  <button class="btn alt" id="bPrev">Précédent</button>
  <button class="btn alt" id="bSkip">Passer</button>
  <button class="btn main" id="bSave">Enregistrer et suivant</button>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script>
const CFG={
  clientId:'a0ba8770-be20-4447-b265-913498cfbe91',
  tenant:'f49028b5-31be-4f3a-b5a1-97ea7b9c5c2f',
  host:'https://lmsgrp-my.sharepoint.com',
  site:'/personal/dblanchard_lms-group_net',
  listId:'b96f8d28-3e16-45c8-af6b-58843ee0c7ce'
};
const MINPH=2;
const SCOPES=[CFG.host+'/AllSites.Write'];
const GL="/_api/web/lists(guid'"+CFG.listId+"')";
const UNITS=['pièce','lot','boîte','sachet','rouleau','mètre','kg','litre','paire','carton','pack'];
const ETATS=['Neuf','Bon état','Usagé','Hors service'];
const pca=new msal.PublicClientApplication({
  auth:{clientId:CFG.clientId,authority:'https://login.microsoftonline.com/'+CFG.tenant,redirectUri:location.origin+location.pathname},
  cache:{cacheLocation:'localStorage'}
});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let items=[],cur=null,draft=null,pending=0,failed=[];

async function token(){
  const acc=pca.getAllAccounts()[0];
  try{return (await pca.acquireTokenSilent({scopes:SCOPES,account:acc})).accessToken}
  catch(e){await pca.acquireTokenRedirect({scopes:SCOPES,account:acc});throw e}
}
async function sp(path,opt){
  opt=opt||{};
  const t=await token();
  const h=Object.assign({Authorization:'Bearer '+t,Accept:'application/json;odata=nometadata'},opt.headers||{});
  const url=path.startsWith('http')?path:CFG.host+CFG.site+path;
  const r=await fetch(url,{method:opt.method||'GET',headers:h,body:opt.body});
  if(!r.ok){const tx=await r.text();throw new Error(r.status+' '+tx.slice(0,160))}
  if(r.status===204)return null;
  return (r.headers.get('content-type')||'').includes('json')?r.json():r.text();
}

function show(html){ $('main').innerHTML=html; }
function center(html){ $('top').hidden=true;$('foot').hidden=true;show('<div class="center">'+html+'</div>'); }

async function start(){
  try{
    const res=await pca.handleRedirectPromise();
    if(res&&res.account)pca.setActiveAccount(res.account);
  }catch(e){ center('<p>Connexion impossible.</p><p class="tag">'+esc(e.message||e)+'</p><button class="btn" onclick="login()">Réessayer</button>'); return; }
  if(!pca.getAllAccounts().length){
    center('<h1>Stocks CLP - RI</h1><p>Connectez-vous avec votre compte professionnel.</p><button class="btn" onclick="login()">Se connecter</button>');
    return;
  }
  await load();
}
function login(){ pca.loginRedirect({scopes:SCOPES}); }

async function load(){
  center('<p>Chargement des lignes...</p>');
  try{
    let url=GL+"/items?$select=Id,Title,Ligne,Categorie,RefFournisseur,NumFiche,Emplacement,Rayon,Position,QteInventoriee,UniteInv,Marque,Etat,RefsComp,QteUnitaire,UniteComptage,Commentaire,Traitee,AttachmentFiles/FileName&$expand=AttachmentFiles&$orderby=Id&$top=1000";
    const all=[];
    while(url){ const r=await sp(url); all.push(...r.value); url=r['odata.nextLink']||null; }
    all.forEach(i=>{i.nPh=(i.AttachmentFiles||[]).length});
    all.sort((x,y)=>String(x.Ligne).localeCompare(String(y.Ligne),undefined,{numeric:true}));
    items=all;
  }catch(e){
    center('<p>Chargement impossible.</p><p class="tag">'+esc(e.message)+'</p><button class="btn" onclick="load()">Réessayer</button>');
    return;
  }
  const acc=pca.getAllAccounts()[0];
  $('who').textContent=(acc&&acc.name)||'';
  const rays=[...new Set(items.map(i=>i.Rayon||''))];
  $('fRay').innerHTML='<option value="">Tous les rayons</option>'+rays.map(r=>'<option value="'+esc(r)+'">'+esc(r||'(sans rayon)')+'</option>').join('');
  const cats=[...new Set(items.map(i=>i.Categorie||''))].sort();
  $('fCat').innerHTML='<option value="">Toutes les catégories</option>'+cats.map(r=>'<option value="'+esc(r)+'">'+esc(r||'(sans catégorie)')+'</option>').join('');
  $('top').hidden=false;$('foot').hidden=false;
  if(cur==null||!items.find(i=>i.Id===cur)) cur=firstOrder();
  openItem(cur);
}

function order(){
  const ray=$('fRay').value,cat=$('fCat').value,mode=$('fMode').value,q=$('fQ').value.trim().toLowerCase();
  return items.filter(i=>{
    if(ray&&(i.Rayon||'')!==ray)return false;
    if(cat&&(i.Categorie||'')!==cat)return false;
    if(mode==='todo'&&i.Traitee)return false;
    if(mode==='done'&&!i.Traitee)return false;
    if(q){const s=[i.Title,i.Ligne,i.Categorie,i.RefFournisseur,i.Marque,i.Position,i.NumFiche].join(' ').toLowerCase();if(!s.includes(q))return false}
    return true;
  });
}
function firstOrder(){const o=order();return o.length?o[0].Id:null}

function stats(){
  const d=items.filter(i=>i.Traitee).length;
  $('prog').style.width=(items.length?100*d/items.length:0)+'%';
  $('stat').textContent=d+' / '+items.length+' traitées'+(pending?' · envoi en cours ('+pending+')':'')+(failed.length?' · '+failed.length+' en échec':'');
}

function openItem(id){
  cur=id;stats();
  const it=items.find(i=>i.Id===id);
  if(!it){
    show('<div class="center"><p>Aucune ligne dans cette sélection.</p></div>'+banners());
    $('bSave').disabled=true;$('bSkip').disabled=true;$('bPrev').disabled=true;return;
  }
  $('bSave').disabled=false;$('bSkip').disabled=false;$('bPrev').disabled=false;
  draft={id:it.Id,marque:it.Marque||'',etat:it.Etat||'',refs:it.RefsComp||'',qu:it.QteUnitaire==null?'':it.QteUnitaire,unit:it.UniteComptage||'',com:it.Commentaire||'',photos:[],err:''};
  draw();
  window.scrollTo(0,0);
}
function banners(){
  let h='';
  failed.forEach((f,k)=>{h+='<div class="msg bad">Échec ligne '+esc(f.job.ligne)+' : '+esc(f.err)+' <button class="link" onclick="retry('+k+')">Réessayer</button></div>'});
  return h;
}
function draw(){
  const it=items.find(i=>i.Id===draft.id);
  const o=order();const pos=o.findIndex(x=>x.Id===it.Id);
  const unitOpts='<option value="">Unité</option>'+UNITS.map(u=>'<option'+(draft.unit===u?' selected':'')+'>'+u+'</option>').join('');
  const etatOpts='<option value="">État</option>'+ETATS.map(u=>'<option'+(draft.etat===u?' selected':'')+'>'+u+'</option>').join('');
  const th=draft.photos.map((p,k)=>'<div class="th"><img src="'+p.url+'" alt=""><button onclick="rmPhoto('+k+')" aria-label="Retirer">x</button></div>').join('');
  const nTot=(it.nPh||0)+draft.photos.length;
  show(banners()+(draft.err?'<div class="msg bad">'+esc(draft.err)+'</div>':'')+
  '<div class="card">'+
    '<div class="tag">N° '+esc(it.Ligne)+(pos>=0?' · '+(pos+1)+' sur '+o.length+' dans la sélection':'')+(it.Traitee?' · déjà traitée':'')+'</div>'+
    '<h1>'+esc(it.Title)+'</h1>'+
    '<div class="meta">'+esc([it.Categorie,it.Rayon,it.Position&&'Position '+it.Position,it.NumFiche&&'Fiche '+it.NumFiche].filter(Boolean).join(' · '))+'</div>'+
    '<div class="meta">Réf. fournisseur : <b>'+esc(it.RefFournisseur||'-')+'</b></div>'+
    '<div class="qte">Quantité en stock : '+esc(it.QteInventoriee==null?'-':it.QteInventoriee)+' '+esc(it.UniteInv||'')+'</div>'+
  '</div>'+
  '<div class="card">'+
    '<label style="margin-top:0">Photos : '+MINPH+' minimum, 3 conseillées (vue d\'ensemble, étiquette ou marque, détail)</label>'+
    '<div class="row"><button class="btn alt" onclick="$(\'fileCam\').click()">Prendre une photo</button><button class="btn alt" onclick="$(\'fileGal\').click()">Galerie</button></div>'+
    '<div class="photos">'+th+'</div>'+
    '<div class="tag" style="margin-top:6px">'+(it.nPh?it.nPh+' photo(s) déjà enregistrée(s) · ':'')+nTot+' / '+MINPH+' minimum</div>'+
    '<label for="dMar">Marque / modèle (lu sur l\'article)</label><input type="text" id="dMar" value="'+esc(draft.marque)+'" autocomplete="off">'+
    '<label for="dEt">État</label><select class="f" id="dEt">'+etatOpts+'</select>'+
    '<label for="dRefs">Références complémentaires</label><input type="text" id="dRefs" value="'+esc(draft.refs)+'" autocomplete="off">'+
    '<div class="row"><div><label for="dQu">Quantité unitaire</label><input type="number" id="dQu" inputmode="decimal" step="any" value="'+esc(draft.qu)+'"></div>'+
    '<div><label for="dUn">Unité de comptage</label><select class="f" id="dUn">'+unitOpts+'</select></div></div>'+
    '<label for="dCom">Commentaire</label><textarea id="dCom">'+esc(draft.com)+'</textarea>'+
  '</div>');
  $('dMar').oninput=e=>draft.marque=e.target.value;
  $('dEt').onchange=e=>draft.etat=e.target.value;
  $('dRefs').oninput=e=>draft.refs=e.target.value;
  $('dQu').oninput=e=>draft.qu=e.target.value;
  $('dUn').onchange=e=>draft.unit=e.target.value;
  $('dCom').oninput=e=>draft.com=e.target.value;
}

async function shrink(file){
  try{
    const b=await createImageBitmap(file);
    const s=Math.min(1,1600/Math.max(b.width,b.height));
    const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);
    c.getContext('2d').drawImage(b,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
  }catch(e){return file}
}
async function addFiles(fl){
  for(const f of fl){const b=await shrink(f);draft.photos.push({blob:b,url:URL.createObjectURL(b)})}
  draft.err='';draw();
}
$('fileCam').onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};
$('fileGal').onchange=async e=>{await addFiles([...e.target.files]);e.target.value=''};
function rmPhoto(k){draft.photos.splice(k,1);draw()}

function nextId(from,dir){
  const o=order();
  if(dir>0){const k=items.findIndex(x=>x.Id===from);const n=o.find(x=>items.indexOf(x)>k);return n?n.Id:(o.length?o[0].Id:null)}
  const k2=items.findIndex(x=>x.Id===from);const p=[...o].reverse().find(x=>items.indexOf(x)<k2);return p?p.Id:(o.length?o[o.length-1].Id:null);
}

$('bSave').onclick=()=>{
  if(!draft)return;
  const it=items.find(i=>i.Id===draft.id);
  if((it.nPh||0)+draft.photos.length<MINPH){draft.err='Au moins '+MINPH+' photos sont nécessaires pour enregistrer cette ligne.';draw();window.scrollTo(0,0);return}
  const fields={Traitee:true,Marque:draft.marque||'',RefsComp:draft.refs||'',Commentaire:draft.com||''};
  if(draft.etat)fields.Etat=draft.etat;
  if(draft.qu!==''&&!isNaN(Number(draft.qu)))fields.QteUnitaire=Number(draft.qu);
  if(draft.unit)fields.UniteComptage=draft.unit;
  const job={id:it.Id,ligne:it.Ligne,fields,photos:draft.photos.map(p=>p.blob),done:0};
  const before=it.Traitee;
  const nxt=nextId(it.Id,1);
  Object.assign(it,{Traitee:true,Marque:fields.Marque,Etat:fields.Etat||it.Etat,RefsComp:fields.RefsComp,Commentaire:fields.Commentaire,QteUnitaire:fields.QteUnitaire==null?it.QteUnitaire:fields.QteUnitaire,UniteComptage:fields.UniteComptage||it.UniteComptage});
  it.nPh=(it.nPh||0)+job.photos.length;
  run(job);
  const n=(nxt===it.Id&&$('fMode').value==='todo')?firstOrder():nxt;
  openItem(n);
};
$('bSkip').onclick=()=>{ if(draft)openItem(nextId(draft.id,1)) };
$('bPrev').onclick=()=>{ if(draft)openItem(nextId(draft.id,-1)) };

async function run(job){
  pending++;stats();
  try{
    for(;job.done<job.photos.length;job.done++){
      const name=job.ligne+'_'+Date.now()+'_'+job.done+'.jpg';
      await sp(GL+"/items("+job.id+")/AttachmentFiles/add(FileName='"+name+"')",{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:job.photos[job.done]});
    }
    await sp(GL+"/items("+job.id+")",{method:'POST',headers:{'Content-Type':'application/json;odata=nometadata','X-HTTP-Method':'MERGE','IF-MATCH':'*'},body:JSON.stringify(job.fields)});
  }catch(e){
    failed.push({job,err:e.message||String(e)});
    const it=items.find(i=>i.Id===job.id);if(it){it.Traitee=false;it.nPh=Math.max(0,(it.nPh||0)-(job.photos.length-job.done))}
  }finally{pending--;stats();if(draft)draw()}
}
function retry(k){const f=failed.splice(k,1)[0];const it=items.find(i=>i.Id===f.job.id);if(it){it.Traitee=true;it.nPh=(it.nPh||0)+(f.job.photos.length-f.job.done)}run(f.job);if(draft)draw()}

['fRay','fCat','fMode'].forEach(id=>$(id).onchange=()=>openItem(firstOrder()));
let qt;$('fQ').oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>openItem(firstOrder()),300)};
$('reload').onclick=()=>{ if(pending){alert('Envois en cours, patientez.');return} load() };
$('out').onclick=()=>pca.logoutRedirect({account:pca.getAllAccounts()[0],postLogoutRedirectUri:location.origin+location.pathname});
window.addEventListener('beforeunload',e=>{ if(pending){e.preventDefault();e.returnValue=''} });

start();
</script>
</body>
</html>
