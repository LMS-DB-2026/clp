.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;top:0;background:var(--bg);z-index:11;display:none;flex-direction:column;overflow:hidden}
.sheet.on{display:flex}

.sb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}

.foot{color:var(--mut);font-size:12px;text-align:center;padding:20px var(--pad)}

<script>
const items=JSON.parse(document.getElementById('data').textContent);
const IMG='img/';
const catLabel={'AUTRES':'Autres','DECORATION':'Décoration','NETTOYAGE':'Nettoyage','CUISINE':'Cuisine','CHAMBRE':'Chambre','ELECTRIQUE':'Électrique','SECURITE':'Sécurité','SPORT':'Sport','PLOMBERIE':'Plomberie','BOISSON':'Boisson','PISCINE':'Piscine','INFORMATIQUE':'Informatique','JARDIN':'Jardin','MATERIEL ROULANT':'Matériel roulant','SONORISATION':'Sonorisation','TENUE AGENT':'Tenues','LOISIRS':'Loisirs','VEHICULE':'Véhicule','NON CLASSE':'Non classé'};
const unit=(q,u)=>{u=(u||'pièce').toLowerCase();return q+' '+(q>1&&!u.endsWith('s')?u+'s':u)};
const fmt=n=>n==null?'':Number(n).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/’/g,"'");
const title=t=>t.toLowerCase().replace(/(^|[\s/(])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let cat='',q='';
const counts={};items.forEach(i=>counts[i.c]=(counts[i.c]||0)+1);
const cats=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
const catsEl=document.getElementById('cats');
function mkBtn(id,label){const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.c=id;b.setAttribute('aria-pressed',id===cat);b.onclick=()=>{cat=id;render();history.replaceState(null,'',cat?'#c='+encodeURIComponent(cat):'#')};return b}
function renderCats(){catsEl.innerHTML='';catsEl.append(mkBtn('','Tout ('+items.length+')'));cats.forEach(c=>catsEl.append(mkBtn(c,(catLabel[c]||title(c))+' ('+counts[c]+')')))}
const grid=document.getElementById('grid'),meta=document.getElementById('meta'),empty=document.getElementById('empty');
function render(){
  renderCats();
  const nq=norm(q);
  const list=items.filter(i=>(!cat||i.c===cat)&&(!nq||norm(i.t+' '+i.r+' '+i.m+' '+i.l).includes(nq)));
  grid.innerHTML='';
  list.forEach(i=>{
    const b=document.createElement('button');b.className='card';b.type='button';
    b.innerHTML='<div class="ph"><img loading="lazy" decoding="async" alt="" src="'+IMG+i.ph[0]+'">'+(i.ph.length>1?'<span class="n">'+i.ph.length+' photos</span>':'')+'</div><div class="t">'+title(i.t)+'</div><div class="s">'+unit(i.q,i.u)+(i.e?' · '+i.e:'')+'</div>'+(i.p!=null?'<div class="p">USD '+fmt(i.p)+'</div>':'');
    b.onclick=()=>open(i);grid.append(b);
  });
  meta.textContent=list.length+' article'+(list.length>1?'s':'')+(cat?' dans '+(catLabel[cat]||title(cat)):'')+(q?' pour « '+q+' »':'');
  empty.hidden=list.length>0;
}
const qEl=document.getElementById('q'),clr=document.getElementById('clr');
qEl.oninput=()=>{q=qEl.value.trim();clr.hidden=!q;render()};
clr.onclick=()=>{qEl.value='';q='';clr.hidden=true;render();qEl.focus()};
// sheet
const sheet=document.getElementById('sheet'),ov=document.getElementById('ov'),strip=document.getElementById('strip'),dots=document.getElementById('dots');
let cur=null;
function open(i){
  cur=i;
  strip.innerHTML=i.ph.map(p=>'<img src="'+IMG+p+'" alt="'+title(i.t)+'">').join('');
  dots.innerHTML=i.ph.length>1?i.ph.map((p,k)=>'<i'+(k==0?' class="on"':'')+'></i>').join(''):'';
  document.getElementById('sl').textContent='Article '+i.l;
  document.getElementById('dt').textContent=title(i.t);
  document.getElementById('dc').textContent=catLabel[i.c]||title(i.c);
  const rows=[['Quantité',unit(i.q,i.u)],['État',i.e||'Non précisé'],['Marque',i.m],['Référence',i.r]].filter(r=>r[1]);
  document.getElementById('dtab').innerHTML=rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('');
  document.getElementById('dp').textContent=i.p!=null?'USD '+fmt(i.p)+' l’unité':'';
  strip.scrollLeft=0;
  sheet.classList.add('on');ov.classList.add('on');document.body.style.overflow='hidden';
  document.getElementById('close').focus();
  history.pushState({a:i.l},'','#a='+i.l);
}
function close(fromPop){
  if(!sheet.classList.contains('on'))return;
  sheet.classList.remove('on');ov.classList.remove('on');document.body.style.overflow='';
  if(!fromPop)history.back();
}
document.getElementById('close').onclick=()=>close();ov.onclick=()=>close();
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(sheet.classList.contains('on')){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});
function step(d){const w=strip.clientWidth;strip.scrollBy({left:d*w})}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
strip.onscroll=()=>{const k=Math.round(strip.scrollLeft/strip.clientWidth);[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===k))};
window.onpopstate=e=>{if(e.state&&e.state.a){const i=items.find(x=>x.l===e.state.a);if(i)open(i)}else close(true)};
// init from hash
const h=new URLSearchParams(location.hash.slice(1));
if(h.get('c'))cat=h.get('c');
render();
if(h.get('a')){const i=items.find(x=>x.l===h.get('a'));if(i)open(i)}
</script>
